<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="112" fill="#090d16"/>
  <rect x="24" y="24" width="464" height="464" rx="92" stroke="#1e293b" stroke-width="4"/>
  <!-- Isometric Grid Subtle -->
  <path d="M256 96 L416 188 L256 280 L96 188 Z" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="6"/>
  <path d="M96 188 L256 280 L256 416 L96 324 Z" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="6"/>
  <path d="M256 280 L416 188 L416 324 L256 416 Z" fill="#075985" fill-opacity="0.4" stroke="#0369a1" stroke-width="6"/>
  
  <!-- Coordinate Axes Origin -->
  <!-- Z Axis (Blue) -->
  <path d="M256 280 L256 120" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <polygon points="256,104 246,124 266,124" fill="#38bdf8"/>
  <text x="272" y="126" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="900" font-size="28">Z</text>
  
  <!-- X Axis (Red) -->
  <path d="M256 280 L380 352" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
  <polygon points="392,359 374,345 382,365" fill="#f43f5e"/>
  <text x="398" y="380" fill="#f43f5e" font-family="system-ui, sans-serif" font-weight="900" font-size="28">X</text>

  <!-- Y Axis (Green) -->
  <path d="M256 280 L132 352" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  <polygon points="120,359 130,365 138,345" fill="#10b981"/>
  <text x="96" y="380" fill="#10b981" font-family="system-ui, sans-serif" font-weight="900" font-size="28">Y</text>

  <!-- CQ Monogram -->
  <circle cx="256" cy="280" r="14" fill="#f8fafc" stroke="#090d16" stroke-width="4"/>
</svg>
